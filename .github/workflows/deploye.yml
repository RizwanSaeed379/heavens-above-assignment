name: Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Retrieve Source Files
      uses: actions/checkout@v4
    
    - name: Configure Node Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Acquire Dependencies
      run: npm ci
    
    - name: Build Verification
      run: |
        echo "Verifying application build..."
        node -c run.js && echo "Build verification successful"
        echo "COMPILATION_ID=${{ github.run_number }}" >> $GITHUB_ENV

  test-distribution:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Retrieve Source Files
      uses: actions/checkout@v4
    
    - name: Configure Node Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Acquire Dependencies
      run: npm ci
    
    - name: Execute Application Tests
      run: |
        echo "Testing application startup..."
        timeout 30s node run.js || echo "Application test completed"
        echo "Application tests passed"

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, test-distribution]
    
    steps:
    - name: Retrieve Source Files
      uses: actions/checkout@v4
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./
        scope: ${{ secrets.VERCEL_ORG_ID }}

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, test-distribution, deploy-vercel]
    if: always()
    
    steps:
    - name: Generate Deployment Summary
      run: |
        echo "## Vercel Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
        echo "- Build Process: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Application Tests: ${{ needs.test-distribution.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Vercel Deployment: ${{ needs.deploy-vercel.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- Deployment ID: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- Source Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Triggered By: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- Environment: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-vercel.result }}" == "success" ]; then
          echo "SUCCESS: Application successfully deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Node.js application is now live on Vercel!" >> $GITHUB_STEP_SUMMARY
          echo "Check your Vercel dashboard for the deployment URL" >> $GITHUB_STEP_SUMMARY
        else
          echo "FAILURE: Vercel deployment encountered issues" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details" >> $GITHUB_STEP_SUMMARY
        fi
