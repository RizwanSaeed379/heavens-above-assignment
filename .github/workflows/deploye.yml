name: Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Retrieve Source Files
      uses: actions/checkout@v4
    
    - name: Configure Node Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Acquire Dependencies
      run: npm ci
    
    - name: Record Compilation Timestamp
      run: |
        echo "COMPILATION_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        echo "COMPILATION_ID=${{ github.run_number }}" >> $GITHUB_ENV
    
    - name: Create AWS Deployment Package
      run: |
        # Create ZIP package for AWS Elastic Beanstalk
        zip -r deployment-package.zip . -x "*.git*" "*.github*" "node_modules/*"
        echo "Deployment package created: $(ls -lh deployment-package.zip)"
    
    - name: Store Distribution Package
      uses: actions/upload-artifact@v4
      with:
        name: aws-deployment-package
        path: deployment-package.zip
        retention-days: 7

  test-distribution:
    name: Test Deployment Package
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Acquire Distribution Package
      uses: actions/download-artifact@v4
      with:
        name: aws-deployment-package
    
    - name: Verify Package Integrity
      run: |
        echo "Verifying deployment package..."
        unzip -l deployment-package.zip | head -20
        echo "Package verification successful!"

  deploy-aws:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: [build, test-distribution]
    environment: production
    
    steps:
    - name: Acquire Distribution Package
      uses: actions/download-artifact@v4
      with:
        name: aws-deployment-package
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Deploy to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v21
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: heavens-above-app
        environment_name: Heavensaboveapp-env
        region: us-east-1
        version_label: v${{ github.run_number }}-${{ github.sha }}
        deployment_package: deployment-package.zip
        wait_for_environment_recovery: 180

  verify-deployment:
    name: Verify AWS Deployment
    runs-on: ubuntu-latest
    needs: deploy-aws
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Check Application Health
      run: |
        echo "Checking application health status..."
        # This would typically use AWS CLI to check health status
        echo "Deployment verification initiated"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, test-distribution, deploy-aws, verify-deployment]
    if: always()
    
    steps:
    - name: Generate Publication Summary
      run: |
        echo "## AWS Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Procedure Status" >> $GITHUB_STEP_SUMMARY
        echo "- Compilation Procedure: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Distribution Verification: ${{ needs.test-distribution.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- AWS Deployment: ${{ needs.deploy-aws.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Deployment Verification: ${{ needs.verify-deployment.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- Compilation Identifier: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- Source Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Publication Initiator: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-aws.result }}" == "success" ]; then
          echo "SUCCESS: Application deployed to AWS Elastic Beanstalk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your application is now live on AWS!" >> $GITHUB_STEP_SUMMARY
          echo "Access your application at the Elastic Beanstalk environment URL" >> $GITHUB_STEP_SUMMARY
        else
          echo "FAILURE: AWS deployment encountered issues" >> $GITHUB_STEP_SUMMARY
        fi